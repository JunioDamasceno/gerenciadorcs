name: gerenciadorcs
version: '4.0'
summary: Um gerenciador de contas e senhas
description: |
  O gerenciador de Contas e Senhas é uma plataforma onde usuários podem 
  armazenar contas, usuários e senhas de forma segura e offline.

icon: snap/gui/gerenciadorcs.png
   
confinement: strict
base: core22

# Força a build apenas para amd64
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

parts:
  gerenciadorcs:
    plugin: python
    source: .  # Como o setup.py está na raiz, usamos o diretório atual
    build-packages:
      - libgirepository1.0-dev
      - pkg-config
    stage-packages:
     # - python3-gi
     # - gir1.2-gtk-3.0
     # - libgirepository-1.0-1
      - libpython3-stdlib

apps:
  gerenciadorcs:
    command: bin/gerenciadorcs
    extensions: [gnome]
    # 'bin/gerenciadorcs' é gerado pelo entry_point que adicionamos no setup.py
    GTK_THEME: Adwaita
    GTK_EXE_PREFIX: /snap/gerenciadorcs/current/usr
    # O comando abaixo limpa os avisos do xapp e atk-bridge no terminal
    GTK_MODULES: ""
    plugs:
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - home
